version: '3'

services:
  frontend:
    build: .
    # Node.jsのグローバル変数です。開発用途なのでdevelopmentを指定します。
    environment:
      - NODE_ENV=development
    volumes:
      - ./:/usr/src/app
    command: sh -c 'cd frontend && yarn start'
    ports:
      # http://localhost:3000/ にて確認可能
      - '3000:3000'
    tty: true

